<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Sono", sans-serif;
        background-color: #f2f4f8;
        margin: 0;
        padding: 40px 20px;
        height: 100vh;
        display: flex;
        align-items: center;

      }

      .pricing-container {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 30px;
        width: 100%;
        width: 1200px;
      }

      .pricing-plan {
        background-color: #ffffff;
        border-radius: 12px;
        padding: 40px 30px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        flex: 1;
        width: 360px;
      }

      .plan-title {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 15px;
        color: #2d3748;
      }

      .plan-price {
        font-size: 2.2rem;
        font-weight: 700;
        color: #4a5568;
        margin-bottom: 25px;
      }

      .plan-features {
        list-style: none;
        padding: 0;
        margin: 0 0 35px 0;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .plan-features li {
        color: #718096;
        font-size: 1rem;
        border-bottom: 1px solid #edf2f7;
        padding-bottom: 12px;
      }

      .plan-button {
        background: #ff5e3a;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        padding: 12px 30px;
        font-size: 1rem;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
      }

      .plan-button:hover {
        opacity: 0.9;
      }



      /* Hint: What can you do with a media query and flexbox? */
      @media (max-width: 1250px) {
        .pricing-container {
          flex-direction: column;
          align-items: center;
        }

        .pricing-plan {
          width: 100%;
          max-width: 500px;
        }
      }
    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basic</div>
        <div class="plan-price">$9.99/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standard</div>
        <div class="plan-price">$19.99/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>
        <div class="plan-price">$49.99/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
